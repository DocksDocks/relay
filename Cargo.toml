[package]
name = "session-relay"
version = "0.18.0"
edition = "2024"
rust-version = "1.85"
description = "session-relay: durable messaging between omp sessions, single static binary"
publish = false
autotests = false

[lib]
name = "relay"
path = "src/lib.rs"

[[bin]]
name = "relay"
path = "src/main.rs"

[[test]]
name = "bus_smoke"
path = "src/tests/bus_smoke.rs"

[[test]]
name = "holds"
path = "src/tests/holds.rs"

[[test]]
name = "lock_race"
path = "src/tests/lock_race.rs"

[[test]]
name = "protocol"
path = "src/tests/protocol.rs"

[dependencies]
tinyjson = "2.5"
libc = "0.2"
rustix = { version = "1.1", features = ["fs", "net", "process"] }

# Size-optimized static binary (min-sized-rust, all stable-channel).
# codegen-units=1 is also a prerequisite for the reproducible-rebuild check.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
