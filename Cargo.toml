[package]
name = "session-relay"
version = "0.16.0"
edition = "2024"
rust-version = "1.85"
description = "session-relay: cross-session/cross-tool agent message bus, single static binary"
publish = false
autotests = false

[lib]
name = "relay"
path = "src/lib.rs"

[[bin]]
name = "relay"
path = "src/main.rs"

[[test]]
name = "bus_smoke"
path = "src/tests/bus_smoke.rs"

[[test]]
name = "fanout"
path = "src/tests/fanout.rs"

[[test]]
name = "fanout_reap"
path = "src/tests/fanout_reap.rs"

[[test]]
name = "lifecycle_admission"
path = "src/tests/lifecycle_admission.rs"

[[test]]
name = "lifecycle_managed"
path = "src/tests/lifecycle_managed.rs"

[[test]]
name = "lifecycle_release"
path = "src/tests/lifecycle_release.rs"

[[test]]
name = "lifecycle_supervisor"
path = "src/tests/lifecycle_supervisor.rs"

[[test]]
name = "lock_race"
path = "src/tests/lock_race.rs"

[[test]]
name = "protocol"
path = "src/tests/protocol.rs"

[[test]]
name = "workspace_coordination_process"
path = "src/tests/workspace_coordination_process.rs"

[[test]]
name = "workspace_identity"
path = "src/tests/workspace_identity.rs"

[[test]]
name = "workspace_lease_process"
path = "src/tests/workspace_lease_process.rs"

[[test]]
name = "workspace_resources"
path = "src/tests/workspace_resources.rs"

[dependencies]
tinyjson = "2.5"
libc = "0.2"
rustix = { version = "1.1", features = ["fs", "net", "process"] }

# Size-optimized static binary (min-sized-rust, all stable-channel).
# codegen-units=1 is also a prerequisite for the reproducible-rebuild check.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
