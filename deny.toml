# cargo-deny policy. `scripts/gate.mjs` runs `cargo deny --locked --offline check`
# after `cargo fetch --locked` and `cargo deny fetch`. Pinned tool: cargo-deny 0.20.2.

[graph]
# The crate ships Linux musl binaries only. Windows-only crates in Cargo.lock are
# never built, so they stay outside the policy graph.
targets = ["x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl"]
all-features = true

[advisories]
version = 2
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
unmaintained = "all"
ignore = []

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception"]
confidence-threshold = 0.9
exceptions = []

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
deny = []
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
